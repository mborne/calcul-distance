<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calcul de distance entre deux villes</title>
  </head>
  <body>
    <main>
      <h1>Distance entre deux villes</h1>

      <div class="champ">
        <label for="depart">Ville de départ</label>
        <input id="depart" type="text" autocomplete="off" placeholder="ex. Paris"
          role="combobox" aria-autocomplete="list" aria-expanded="false"
          aria-controls="depart-suggestions" />
        <ul id="depart-suggestions" class="suggestions" role="listbox" hidden></ul>
      </div>

      <div class="champ">
        <label for="arrivee">Ville d'arrivée</label>
        <input id="arrivee" type="text" autocomplete="off" placeholder="ex. Marseille"
          role="combobox" aria-autocomplete="list" aria-expanded="false"
          aria-controls="arrivee-suggestions" />
        <ul id="arrivee-suggestions" class="suggestions" role="listbox" hidden></ul>
      </div>

      <output id="resultat" aria-live="polite"></output>
      <p id="erreur" class="erreur" role="alert"></p>

      <footer>
        Recherche des communes : service d'autocomplétion de la
        <a href="https://geoservices.ign.fr/documentation/services/services-geoplateforme/autocompletion">Géoplateforme (IGN)</a>.
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
