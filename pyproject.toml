[project]
name = "calcul-distance"
version = "0.1.0"
description = "Calcul de la distance à vol d'oiseau entre deux villes françaises (géocodage Géoplateforme IGN)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
calcul-distance = "calcul_distance.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
